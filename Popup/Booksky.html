<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <h1>Booksky</h1>
    </div>

    <div class="container">

        <div class="book-container">
            <h2>Rich Dad Poor Dad</h2>
            <h5>Robert</h5>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Cupiditate sequi laboriosam non quae accusamus nisi voluptatem sit explicabo earum, quas obcaecati expedita quaerat aut voluptas corrupti illo! Odio, facere unde?</p>
            <button onclick="deletebook(event)">Delete</button>
        </div>
    </div>

    <div class="popup-overlay"></div>

    <div class="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title-input">
            <input type="text" placeholder="Book Author" id="book-author-input">
            <textarea placeholder="Short Description" id="book-description-input"></textarea>
            <button id="add-book">ADD</button>
            <button id="cancel-popup">CANCEL</button>
        </form>
    </div>

    <button class="add-button" id="add-popup-button">+</button>

    <script>
        var popupoverlay=document.querySelector(".popup-overlay")
        var popupbox=document.querySelector(".popup-box")
        var addpopupbutton=document.getElementById("add-popup-button")
        addpopupbutton.addEventListener("click",function(){
            popupoverlay.style.display="block"
            popupbox.style.display="block"
        })
        // select cancel button
        var cancelpopup=document.getElementById("cancel-popup")
        cancelpopup.addEventListener("click",function(event){
            event.preventDefault()
            popupoverlay.style.display="none"
            popupbox.style.display="none"
        })

        //select container,add-book,book-title-input,book-author-input,book-description-input
        var container=document.querySelector(".container")
        var addbook=document.getElementById("add-book")
        var booktitleinput=document.getElementById("book-title-input")
        var bookauthorinput=document.getElementById("book-author-input")
        var bookdescriptioninput=document.getElementById("book-description-input")

        addbook.addEventListener("click",function(event){
            event.preventDefault()
            var div=document.createElement("div")
            div.setAttribute("class","book-container")
            div.innerHTML=`<h2>${booktitleinput.value}</h2>
            <h5>${bookauthorinput.value}</h5>
            <p>${bookdescriptioninput.value}</p>
            <button onclick="deletebook(event)">Delete</button>`
            container.append(div)
            popupoverlay.style.display="none"
            popupbox.style.display="none"
        })

        function deletebook(event)
        {
            event.target.parentElement.remove()
        }
    </script>
</body>
</html>
